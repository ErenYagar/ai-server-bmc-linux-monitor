name: BMC Linux CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        run: make clean all
      - name: Unit tests
        run: make test
      - name: Regression tests
        run: make regression
